<title>Персонажи Dorkin Academy</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
/>
<style>
  /* Layout: a game roster screen — character tabs, the 3D stage, the level panel. Single dark look by choice. */
  :root {
    --ember: #f26a21;
    --ember-hi: #ffa15c;
    --flame: #d9441c;
    --maroon: #8a1a12;
    --ink: #0d0b0a;
    --panel: #161210;
    --line: #2b221d;
    --text: #f3eee9;
    --muted: #a89c93;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Golos Text", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html,
  body {
    height: 100%;
  }
  body {
    background:
      radial-gradient(120% 70% at 50% 0%, #2a120a 0%, var(--ink) 55%) fixed,
      var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 32px;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    gap: 16px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabs button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font: 600 14px var(--body);
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px 8px 8px;
    cursor: pointer;
  }
  .tabs button i {
    font: 700 11px/1 var(--mono);
    font-style: normal;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #241b16;
    color: var(--ember-hi);
  }
  .tabs button[aria-pressed="true"] {
    color: var(--text);
    border-color: var(--ember);
    background: #22140d;
  }
  .tabs button[aria-pressed="true"] i {
    background: var(--ember);
    color: #160701;
  }
  header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .eyebrow {
    font: 600 11px/1 var(--body);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ember-hi);
  }
  h1 {
    margin: 6px 0 0;
    font: 700 clamp(30px, 6vw, 52px)/1 var(--display);
    letter-spacing: -0.02em;
  }
  .role {
    color: var(--muted);
    margin-top: 6px;
    max-width: 60ch;
  }
  .stage-pill {
    font: 500 13px/1 var(--mono);
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ember-hi);
    white-space: nowrap;
  }
  .scene {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: radial-gradient(60% 60% at 50% 70%, #24130c 0%, #0b0908 70%);
    height: min(60vh, 540px);
    min-height: 360px;
    touch-action: none;
    cursor: grab;
  }
  .scene:active {
    cursor: grabbing;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hint {
    position: absolute;
    left: 14px;
    bottom: 12px;
    font: 500 12px var(--body);
    color: var(--muted);
    pointer-events: none;
  }
  .flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      50% 50% at 50% 55%,
      rgba(255, 140, 60, 0.55),
      transparent 70%
    );
    opacity: 0;
    transition: opacity 0.6s;
  }
  .flash.on {
    opacity: 1;
    transition: none;
  }
  .toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    font: 700 14px var(--display);
    color: var(--ink);
    background: var(--ember-hi);
    padding: 8px 14px;
    border-radius: 999px;
    opacity: 0;
    transition:
      opacity 0.4s,
      transform 0.4s;
    white-space: nowrap;
  }
  .toast.on {
    opacity: 1;
    transform: translateX(-50%) translateY(4px);
  }
  .panel {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .panel {
      grid-template-columns: 1fr;
    }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    display: grid;
    gap: 14px;
    min-width: 0;
    align-content: start;
  }
  .level-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .level {
    font: 700 44px/1 var(--display);
    font-variant-numeric: tabular-nums;
  }
  .level small {
    font: 500 14px var(--body);
    color: var(--muted);
    margin-left: 6px;
  }
  .skills {
    font: 500 13px var(--mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--ember);
    height: 28px;
  }
  .bar {
    height: 10px;
    border-radius: 99px;
    background: #241b16;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(
      90deg,
      var(--maroon),
      var(--flame),
      var(--ember-hi)
    );
    transition: width 0.3s;
  }
  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .buttons button {
    font: 600 14px var(--body);
    border-radius: 12px;
    padding: 11px 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #1f1814;
    color: var(--text);
  }
  .buttons button.primary {
    background: var(--ember);
    color: #160701;
    border-color: transparent;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--ember-hi);
    outline-offset: 2px;
  }
  ol.stages {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }
  ol.stages li {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  ol.stages li b {
    font: 500 12px var(--mono);
    padding-top: 2px;
  }
  ol.stages li.done,
  ol.stages li.now {
    color: var(--text);
  }
  ol.stages li.done b {
    color: var(--ember-hi);
  }
  ol.stages li.now b {
    color: var(--ink);
    background: var(--ember-hi);
    border-radius: 6px;
    padding: 2px 6px;
    justify-self: start;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) {
    .toast,
    .flash,
    .bar > span {
      transition: none;
    }
  }
</style>

<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Персонажи"></nav>
  <header>
    <div>
      <div class="eyebrow">Персонаж · технология</div>
      <h1 id="name">HTML</h1>
      <div class="role" id="role"></div>
    </div>
    <div class="stage-pill" id="stagePill"></div>
  </header>
  <div class="scene" id="scene">
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
    <div class="hint">Потяните, чтобы повернуть</div>
  </div>
  <div class="panel">
    <section class="card" aria-label="Уровень персонажа">
      <div class="level-row">
        <div class="level"><span id="lvl">0</span><small>уровень</small></div>
        <div class="skills" id="skills"></div>
      </div>
      <div class="bar"><span id="bar"></span></div>
      <label for="level" class="note"
        >Подвигайте уровень, чтобы увидеть, как меняется персонаж</label
      >
      <input id="level" type="range" min="0" max="100" value="12" />
      <div class="buttons">
        <button class="primary" id="plus" type="button">
          + Подтвердить навык
        </button>
        <button id="reset" type="button">Сбросить</button>
        <button id="max" type="button">Максимум</button>
      </div>
    </section>
    <section class="card" aria-label="Ранги">
      <div class="eyebrow">Ранги</div>
      <ol class="stages" id="stages"></ol>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  (() => {
    // ================= shared scene =================
    const host = document.getElementById("scene");
    const reduced = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    host.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
    const LOOK_Y = 2.2;
    const hemi = new THREE.HemisphereLight(0xfff4ea, 0x120c08, 0.45);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(3, 5, 4);
    scene.add(key);
    const rim = new THREE.PointLight(0xffffff, 0, 14);
    rim.position.set(-2.2, 3, -2.4);
    scene.add(rim);
    const rim2 = new THREE.PointLight(0xffffff, 0, 14);
    rim2.position.set(2.4, 2, -2);
    scene.add(rim2);
    const coreLight = new THREE.PointLight(0xffffff, 0, 5);
    scene.add(coreLight);

    const canvasTex = (size, draw) => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      draw(c.getContext("2d"), size);
      return new THREE.CanvasTexture(c);
    };
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.6, 64),
      new THREE.MeshStandardMaterial({ color: 0x0f0d0c, roughness: 0.95 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    // White textures, tinted per character through material colour
    const ringMat = new THREE.MeshBasicMaterial({
      map: canvasTex(256, (g) => {
        const r = g.createRadialGradient(128, 128, 20, 128, 128, 128);
        r.addColorStop(0, "rgba(255,255,255,0)");
        r.addColorStop(0.62, "rgba(255,255,255,0.05)");
        r.addColorStop(0.8, "rgba(255,255,255,0.9)");
        r.addColorStop(0.86, "rgba(255,255,255,0.25)");
        r.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = r;
        g.fillRect(0, 0, 256, 256);
      }),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0
    });
    const ring = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 5.6), ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(1, 48),
      new THREE.MeshBasicMaterial({
        color: 0,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.015;
    scene.add(shadow);
    const N = 360,
      pGeo = new THREE.BufferGeometry(),
      pos = new Float32Array(N * 3),
      seed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      seed[i] = Math.random();
      pos[i * 3 + 1] = -10;
    }
    pGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.17,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      opacity: 0,
      map: canvasTex(64, (g) => {
        const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        r.addColorStop(0, "rgba(255,255,255,1)");
        r.addColorStop(0.35, "rgba(255,255,255,0.7)");
        r.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = r;
        g.fillRect(0, 0, 64, 64);
      })
    });
    scene.add(new THREE.Points(pGeo, pMat));

    // ================= kit =================
    const hex = (n) => "#" + n.toString(16).padStart(6, "0");
    function makeKit(pal) {
      const m = {
        stone: new THREE.MeshStandardMaterial({
          color: 0x55524f,
          roughness: 0.85,
          metalness: 0.05
        }),
        plate: new THREE.MeshStandardMaterial({
          color: pal.plate,
          roughness: 0.32,
          metalness: 0.75
        }),
        trim: new THREE.MeshStandardMaterial({
          color: pal.trim,
          roughness: 0.35,
          metalness: 0.55
        }),
        glow: new THREE.MeshStandardMaterial({
          color: 0x111111,
          emissive: pal.glow,
          emissiveIntensity: 0,
          roughness: 0.4
        }),
        crack: new THREE.MeshBasicMaterial({ color: 0x1b1714 }),
        seam: new THREE.MeshBasicMaterial({
          color: pal.aura,
          transparent: true,
          opacity: 0
        }),
        hot: new THREE.MeshStandardMaterial({
          color: 0x111111,
          emissive: pal.glow,
          emissiveIntensity: 2.2,
          roughness: 0.3
        })
      };
      const grow = [];
      const place = (mesh, x, y, z, p) => {
        mesh.position.set(x, y, z);
        p.add(mesh);
        return mesh;
      };
      return {
        m,
        grow,
        pal,
        box: (w, h, d, mat, x, y, z, p) =>
          place(
            new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat),
            x,
            y,
            z,
            p
          ),
        cyl: (rt, rb, h, seg, mat, x, y, z, p) =>
          place(
            new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat),
            x,
            y,
            z,
            p
          ),
        cone: (r, h, seg, mat, x, y, z, p) =>
          place(
            new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), mat),
            x,
            y,
            z,
            p
          ),
        torus: (r, t, mat, x, y, z, p, seg = 24) =>
          place(
            new THREE.Mesh(new THREE.TorusGeometry(r, t, 6, seg), mat),
            x,
            y,
            z,
            p
          ),
        ico: (r, mat, x, y, z, p, d = 1) =>
          place(
            new THREE.Mesh(new THREE.IcosahedronGeometry(r, d), mat),
            x,
            y,
            z,
            p
          ),
        oct: (r, mat, x, y, z, p) =>
          place(
            new THREE.Mesh(new THREE.OctahedronGeometry(r), mat),
            x,
            y,
            z,
            p
          ),
        gear(mesh, a, b) {
          mesh.scale.setScalar(0.001);
          grow.push([mesh, a, b]);
          return mesh;
        },
        group: (x, y, z, p) => {
          const g = new THREE.Group();
          g.position.set(x, y, z);
          p.add(g);
          return g;
        },
        slab(text, w = 0.5) {
          const tex = canvasTex(128, (g, s) => {
            g.fillStyle = "#0e0c0b";
            g.fillRect(0, 0, s, s);
            g.strokeStyle = hex(pal.glow);
            g.lineWidth = 6;
            g.strokeRect(5, 5, s - 10, s - 10);
            g.fillStyle = "#ffffff";
            const size = text.length > 5 ? 22 : text.length > 3 ? 28 : 36;
            g.font = `700 ${size}px JetBrains Mono, monospace`;
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText(text, s / 2, s / 2 + 2);
          });
          return new THREE.Mesh(
            new THREE.BoxGeometry(w, w, 0.06),
            new THREE.MeshStandardMaterial({
              map: tex,
              emissive: pal.glow,
              emissiveMap: tex,
              emissiveIntensity: 0.8,
              roughness: 0.4
            })
          );
        },
        bar(w, x, y, rot, p, mat, t = 0.075) {
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(w, t, t),
            mat || this.m.hot
          );
          b.position.set(x, y, 0);
          b.rotation.z = rot;
          p.add(b);
          return b;
        }
      };
    }
    function cracksOn(K, p, z, s = 1) {
      for (const [w, h, x, y, r] of [
        [0.5, 0.035, -0.38, 0.28, 0.35],
        [0.035, 0.34, -0.15, 0.06, 0],
        [0.42, 0.035, 0.36, -0.05, -0.3],
        [0.3, 0.035, -0.36, -0.4, 0.5]
      ])
        K.box(w * s, h, 0.02, K.m.crack, x * s, y * s, z, p).rotation.z = r;
    }
    function frameOutline(K, w, h, d, mat, p, t = 0.05) {
      // a hollow box made of 12 bars
      const g = new THREE.Group();
      p.add(g);
      for (const [x, y] of [
        [-1, -1],
        [1, -1],
        [-1, 1],
        [1, 1]
      ]) {
        K.box(t, h, t, mat, (x * w) / 2, 0, (y * d) / 2, g);
        K.box(w, t, t, mat, 0, (x * h) / 2, (y * d) / 2, g);
        K.box(t, t, d, mat, (x * w) / 2, (y * h) / 2, 0, g);
      }
      return g;
    }

    // ================= characters =================
    const RANKS = [0, 20, 40, 60, 80];
    const CHARACTERS = [
      {
        key: "pc",
        tab: "ПК",
        name: "ПК",
        role: "Знаток компьютера. Железо, файлы, система и сеть.",
        skills: 40,
        master: "Мастер железа",
        pal: {
          base: 0x3f5f86,
          plate: 0x1b2633,
          trim: 0xa9bccf,
          glow: 0x38e1ff,
          aura: 0x8ff3ff,
          ui: ["#38e1ff", "#a5f3fc", "#0e7490", "#083344"]
        },
        stages: [
          "Пыльный системник на гусеницах, экран еле светится.",
          "Экран-лицо оживает голубым, мигает питание.",
          "Броня-панели, радиаторы, клешни в латах.",
          "Парит; вокруг CPU, RAM, SSD; над головой вентилятор.",
          "Крылья из шлейфов, из вентиляции бьёт свет."
        ],
        orbit: ["CPU", "RAM", "SSD", "GPU", "USB", "OS"],
        build(K, body) {
          // Tank treads instead of legs
          const wheels = [];
          for (const side of [-1, 1]) {
            const tr = K.group(side * 0.55, 0.3, 0, body);
            K.box(0.42, 0.5, 1.5, K.m.plate, 0, 0, 0, tr);
            for (let i = 0; i < 4; i++) {
              const w = K.cyl(
                0.2,
                0.2,
                0.46,
                10,
                K.m.stone,
                0,
                -0.02,
                -0.54 + i * 0.36,
                tr
              );
              w.rotation.z = Math.PI / 2;
              wheels.push(w);
            }
            K.gear(K.box(0.48, 0.12, 1.56, K.m.trim, 0, 0.28, 0, tr), 42, 52);
          }
          const torso = K.group(0, 1.35, 0, body);
          K.box(1.3, 1.1, 0.95, K.m.stone, 0, 0, 0, torso);
          for (let i = 0; i < 3; i++)
            K.box(
              0.66,
              0.1,
              0.04,
              K.m.plate,
              -0.2,
              0.3 - i * 0.15,
              0.49,
              torso
            );
          for (let i = 0; i < 4; i++)
            K.box(
              0.5,
              0.03,
              0.02,
              K.m.crack,
              -0.2,
              -0.18 - i * 0.08,
              0.485,
              torso
            );
          const core = K.box(
            0.12,
            0.12,
            0.04,
            K.m.glow,
            0.42,
            0.34,
            0.49,
            torso
          );
          K.gear(K.box(0.06, 1.0, 0.98, K.m.trim, -0.68, 0, 0, torso), 40, 48);
          K.gear(K.box(0.06, 1.0, 0.98, K.m.trim, 0.68, 0, 0, torso), 40, 48);
          const seams = [
            K.box(1.34, 0.03, 0.99, K.m.seam, 0, 0.12, 0, torso),
            K.box(1.34, 0.03, 0.99, K.m.seam, 0, -0.3, 0, torso)
          ];
          const head = K.group(0, 2.35, 0, body);
          K.box(0.22, 0.24, 0.22, K.m.plate, 0, -0.44, 0, head);
          K.box(1.25, 0.82, 0.22, K.m.stone, 0, 0, 0, head);
          K.box(1.06, 0.66, 0.04, K.m.plate, 0, 0, 0.12, head);
          const eyeL = K.box(
              0.18,
              0.18,
              0.03,
              K.m.glow,
              -0.22,
              0.06,
              0.145,
              head

    let lastStage = 0;
    function setLevel(l, celebrate = true) {
      target = Math.max(0, Math.min(100, Math.round(l)));
      $("level").value = target;
      $("lvl").textContent = target;
      $("bar").style.width = target + "%";
      $("skills").textContent =
        `${Math.round((target / 100) * C.skills)} из ${C.skills} навыков`;
      const st = stageOf(target),
        n = names(C);
      $("stagePill").textContent = "Ранг: " + n[st];
      [...$("stages").children].forEach(
        (li, i) => (li.className = i < st ? "done" : i === st ? "now" : "")
      );
      if (celebrate && st > lastStage) {
        $("toast").textContent = "Новый ранг: " + n[st];
        $("flash").classList.add("on");
        $("toast").classList.add("on");
        requestAnimationFrame(() =>
          requestAnimationFrame(() => $("flash").classList.remove("on"))
        );
        setTimeout(() => $("toast").classList.remove("on"), 1600);
      }
      lastStage = st;
    }
    function select(key) {
      const ch = CHARACTERS.find((c) => c.key === key) || CHARACTERS[0];
      assemble(ch);
      $("name").textContent = ch.name;
      $("role").textContent = ch.role;
      [...$("tabs").children].forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.key === ch.key))
      );
      const n = names(ch);
      $("stages").innerHTML = ch.stages
        .map(
          (text, i) =>
            `<li><b>${RANKS[i]}+</b><span><strong>${n[i]}.</strong> ${text}</span></li>`
        )
        .join("");
      shown = target;
      lastStage = stageOf(target);
      setLevel(target, false);
      if (location.hash.slice(1) !== ch.key)
        history.replaceState(null, "", "#" + ch.key);
    }
    $("tabs").innerHTML = CHARACTERS.map(
      (c) =>
        `<button type="button" data-key="${c.key}" aria-pressed="false"><i>${c.tab}</i>${c.name}</button>`
    ).join("");
    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) select(b.dataset.key);
    });
    window.addEventListener("hashchange", () => select(location.hash.slice(1)));
    $("level").addEventListener("input", (e) => setLevel(+e.target.value));
    $("plus").addEventListener("click", () =>
      setLevel(target + (100 / C.skills) * 3)
    );
    $("reset").addEventListener("click", () => setLevel(0, false));
    $("max").addEventListener("click", () => setLevel(100));
    select(location.hash.slice(1) || "pc");
    requestAnimationFrame(frame);
  })();
</script>
