version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # NestJS packages must move together; one at a time they fail to install.
      nestjs:
        patterns:
          - "@nestjs/*"
    ignore:
      # Types follow the runtime: Node 24 (package.json engines, CI, containers).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not supported yet by typescript-eslint (<6.1) or
      # @nestjs/swagger (^5.5 || ^6); revisit when both allow it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # NestJS 12 ships as ESM only and took the API down on Vercel (#164);
      # upgrade only after a green Vercel preview of the API.
      - dependency-name: "@nestjs/*"
        versions: [">=12.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
