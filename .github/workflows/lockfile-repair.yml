name: Lockfile repair

on:
  push:
    branches:
      - foundation/grader-gvisor-sandbox
    paths:
      - .github/lockfile-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate repository-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = "10.34.5"

      - name: Rebuild lockfile from trusted main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:pnpm-lock.yaml > pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts

      - name: Verify lockfile delta is importer-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "FETCH_HEAD", "--", "pnpm-lock.yaml"],
              text=True,
          )
          added = [line for line in diff.splitlines() if line.startswith("+") and not line.startswith("+++")]
          removed = [line for line in diff.splitlines() if line.startswith("-") and not line.startswith("---")]
          expected = [
              "+      '@platform/contracts':",
              "+        specifier: workspace:*",
              "+        version: link:../../packages/contracts",
          ]
          if removed or added != expected:
              raise SystemExit(f"unexpected pnpm-lock.yaml delta\n{diff}")
          print(diff)
          PY

      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: restore lockfile integrity metadata"
          git push origin HEAD:foundation/grader-gvisor-sandbox
