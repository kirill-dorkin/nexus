name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://platform_app:platform_app@127.0.0.1:5432/platform
  DATABASE_MIGRATION_URL: postgresql://platform_migrator:platform_migrator@127.0.0.1:5432/platform
  DATABASE_WORKER_URL: postgresql://platform_worker:platform_worker@127.0.0.1:5432/platform

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=postgres pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/grader-runner/.go-version
          cache: false

      - name: Verify trusted grader runner
        working-directory: apps/grader-runner
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.8"
          go mod download
          go mod verify
          if go list -deps ./... | grep -q '^github.com/dop251/goja_nodejs'; then
            echo "goja_nodejs must not enter the trusted runner dependency graph" >&2
            exit 1
          fi
          go vet ./...
          go test ./...

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify trusted grader runner reproducibility
        env:
          GRADER_RUNNER_EVIDENCE_FILE: ${{ runner.temp }}/grader-runner-reproducibility.env
        run: apps/grader-runner/scripts/verify-reproducible.sh

      - name: Publish trusted grader runner reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grader-runner-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/grader-runner-reproducibility.env
          if-no-files-found: error
          retention-days: 14

      - name: Activate repository-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = "10.34.5"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Restore build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-
            ${{ runner.os }}-node24-build-main-
            ${{ runner.os }}-node24-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres
          -v "$PWD/infra/postgres/init:/init:ro"
          postgres:18.6-bookworm
          psql -h 127.0.0.1 -U postgres -d postgres
          --set=ON_ERROR_STOP=1
          --file=/init/001-runtime-roles.sql

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify migration idempotency
        run: pnpm db:migrate

      - name: Brand isolation
        run: pnpm check:brand

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: API production smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @platform/api start > /tmp/platform-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/v1/health > /tmp/platform-api-health.json; then
              grep -q '"status":"ok"' /tmp/platform-api-health.json
              exit 0
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/platform-api.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/platform-api.log
          exit 1
