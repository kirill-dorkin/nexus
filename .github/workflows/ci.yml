name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://platform_app:platform_app@127.0.0.1:5432/platform
  DATABASE_MIGRATION_URL: postgresql://platform_migrator:platform_migrator@127.0.0.1:5432/platform
  DATABASE_WORKER_URL: postgresql://platform_worker:platform_worker@127.0.0.1:5432/platform

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=postgres pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate repository-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = "10.34.5"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Restore build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-
            ${{ runner.os }}-node24-build-main-
            ${{ runner.os }}-node24-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres
          -v "$PWD/infra/postgres/init:/init:ro"
          postgres:18.6-bookworm
          psql -h 127.0.0.1 -U postgres -d postgres
          --set=ON_ERROR_STOP=1
          --file=/init/001-runtime-roles.sql

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify migration idempotency
        run: pnpm db:migrate

      - name: Brand isolation
        run: pnpm check:brand

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Temporary diagnostic run while GitHub App job logs are unavailable.
      # Run the exact full integration suite in one Vitest process and persist
      # a machine-readable report so individual file outcomes appear as steps.
      - name: Integration diagnostics - full suite
        continue-on-error: true
        run: |
          set +e
          pnpm exec vitest run --config vitest.integration.config.ts --reporter=json --outputFile=/tmp/integration-results.json
          status=$?
          echo "$status" > /tmp/integration-exit-code
          exit "$status"

      - name: Prepare integration result reader
        if: ${{ always() }}
        run: |
          cat > /tmp/check-integration-result.cjs <<'NODE'
          const fs = require('node:fs');
          const target = process.argv[2];
          const reportPath = '/tmp/integration-results.json';
          if (!fs.existsSync(reportPath)) {
            console.error(`Integration report is missing while checking ${target}`);
            process.exit(2);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const result = (report.testResults || []).find((item) =>
            item.name === target || item.name?.endsWith(`/${target}`) || item.name?.endsWith(target),
          );
          if (!result) {
            console.error(`No integration result found for ${target}`);
            process.exit(2);
          }
          const assertionFailed = (result.assertionResults || []).some((item) => item.status === 'failed');
          if (result.status === 'failed' || assertionFailed) {
            process.exit(1);
          }
          process.exit(0);
          NODE

      - name: Integration result - api
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/api.integration.test.ts

      - name: Integration result - assignments
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/assignments-http.integration.test.ts

      - name: Integration result - attempt submission
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/attempt-submission-http.integration.test.ts

      - name: Integration result - commerce
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/commerce-http.integration.test.ts

      - name: Integration result - delivery history
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/delivery-history-hardening.integration.test.ts

      - name: Integration result - delivery runs
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/delivery-runs-http.integration.test.ts

      - name: Integration result - guided build guidance
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/guided-build-guidance-http.integration.test.ts

      - name: Integration result - learner runner
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/learner-runner-http.integration.test.ts

      - name: Integration result - learner skill progress
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/learner-skill-progress-http.integration.test.ts

      - name: Integration result - learning event history
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/learning-event-history-http.integration.test.ts

      - name: Integration result - learning
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/learning-http.integration.test.ts

      - name: Integration result - learning loop
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/learning-loop-http.integration.test.ts

      - name: Integration result - mastery
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/mastery-http.integration.test.ts

      - name: Integration result - membership
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/membership-http.integration.test.ts

      - name: Integration result - organizations
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/modules/organizations/organizations.integration.test.ts

      - name: Integration result - recommendation
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/recommendation-http.integration.test.ts

      - name: Integration result - sessions attendance
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/sessions-attendance-http.integration.test.ts

      - name: Integration result - validation results
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs apps/api/src/validation-results-http.integration.test.ts

      - name: Integration result - database
        if: ${{ always() }}
        continue-on-error: true
        run: node /tmp/check-integration-result.cjs packages/database/src/database.integration.test.ts

      - name: Enforce integration result
        if: ${{ always() }}
        run: |
          test -f /tmp/integration-exit-code
          test "$(cat /tmp/integration-exit-code)" = "0"

      - name: Build
        run: pnpm build

      - name: API production smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @platform/api start > /tmp/platform-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/v1/health > /tmp/platform-api-health.json; then
              grep -q '"status":"ok"' /tmp/platform-api-health.json
              exit 0
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/platform-api.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/platform-api.log
          exit 1
