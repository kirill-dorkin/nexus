name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://platform_app:platform_app@127.0.0.1:5432/platform
  DATABASE_MIGRATION_URL: postgresql://platform_migrator:platform_migrator@127.0.0.1:5432/platform
  DATABASE_WORKER_URL: postgresql://platform_worker:platform_worker@127.0.0.1:5432/platform

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGPASSWORD=postgres pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/grader-runner/.go-version
          cache: false

      - name: Verify trusted grader runner
        working-directory: apps/grader-runner
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.8"
          go mod download
          go mod verify
          if go list -deps ./... | grep -q '^github.com/dop251/goja_nodejs'; then
            echo "goja_nodejs must not enter the trusted runner dependency graph" >&2
            exit 1
          fi
          go vet ./...
          go test ./...

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify trusted grader runner reproducibility
        env:
          GRADER_RUNNER_EVIDENCE_FILE: ${{ runner.temp }}/grader-runner-reproducibility.env
        run: apps/grader-runner/scripts/verify-reproducible.sh

      - name: Publish trusted grader runner reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grader-runner-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/grader-runner-reproducibility.env
          if-no-files-found: error
          retention-days: 14

      - name: Verify canonical trusted runner profile binding
        env:
          GRADER_RUNNER_EVIDENCE_FILE: ${{ runner.temp }}/grader-runner-reproducibility.env
        run: |
          set -euo pipefail
          expected="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("infra/grader/execution-profiles/js-sum-v1-v1.json","utf8")); if (!Array.isArray(p) || p.length !== 1) process.exit(2); process.stdout.write(p[0].runnerImageDigest)')"
          actual="$(sed -n 's/^GRADER_RUNNER_IMAGE_DIGEST=//p' "$GRADER_RUNNER_EVIDENCE_FILE")"
          test -n "$actual"
          test "$actual" = "$expected"

      - name: Activate repository-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          test "$(pnpm --version)" = "10.34.5"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      - name: Restore build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-build-${{ github.head_ref || github.ref_name }}-
            ${{ runner.os }}-node24-build-main-
            ${{ runner.os }}-node24-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Vercel CLI installation
        run: pnpm dlx --allow-build=esbuild vercel@62.7.0 --version

      - name: Bootstrap database roles
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres
          -v "$PWD/infra/postgres/init:/init:ro"
          postgres:18.6-bookworm
          psql -h 127.0.0.1 -U postgres -d postgres
          --set=ON_ERROR_STOP=1
          --file=/init/001-runtime-roles.sql

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify migration idempotency
        run: pnpm db:migrate

      - name: Brand isolation
        run: pnpm check:brand

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database integration tests
        run: pnpm test:integration

      - name: Public launch performance verification
        run: pnpm test:launch-performance

      - name: Build
        env:
          NEXT_PUBLIC_API_ORIGIN: https://127.0.0.1:4443
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_browser_verification_token
          NEXT_PUBLIC_PADDLE_ENVIRONMENT: sandbox
        run: pnpm build

      - name: Verify production container build
        run: |
          docker build --file infra/production/Dockerfile --build-arg PUBLIC_ORIGIN=https://deployment.example.test --tag platform-launch:ci .
          PLATFORM_IMAGE=platform-launch:ci PUBLIC_HOST=deployment.example.test docker compose --file infra/production/compose.yml config --quiet
          docker run --rm --entrypoint node platform-launch:ci --check infra/production/entrypoint.mjs
          docker run --rm --entrypoint caddy --env PUBLIC_HOST=deployment.example.test --mount "type=bind,source=$PWD/infra/production/Caddyfile,target=/etc/caddy/Caddyfile,readonly" caddy:2 validate --config /etc/caddy/Caddyfile

      - name: Public launch browser verification
        id: browser-launch
        env:
          PUBLIC_LAUNCH_BROWSER_DIAGNOSTIC_FILE: ${{ runner.temp }}/public-launch-browser-diagnostic.json
        run: pnpm test:browser-launch

      - name: Publish public launch browser diagnostic
        if: ${{ failure() && steps.browser-launch.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-launch-browser-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/public-launch-browser-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Production container smoke
        shell: bash
        env:
          PLATFORM_IMAGE: platform-launch:ci
          PUBLIC_HOST: deployment.example.test
          COMPOSE_PROJECT_NAME: launch-ci-${{ github.run_id }}-${{ github.run_attempt }}
          COMPOSE_FILE: infra/production/compose.yml
        run: |
          set -euo pipefail
          # Isolated random role credentials, private PostgreSQL and disposable CI volumes.
          node infra/production/create-secrets.mjs
          cleanup() {
            docker compose --profile migration down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -rf infra/production/secrets
          }
          trap cleanup EXIT
          docker compose run --rm migrate
          docker compose run --rm migrate
          docker compose up -d api web
          for attempt in {1..30}; do
            if docker compose exec -T api node -e 'fetch("http://127.0.0.1:4000/v1/health").then(async r=>{if(!r.ok||(await r.json()).status!=="ok")process.exit(1)}).catch(()=>process.exit(1))' && docker compose exec -T web node -e 'fetch("http://127.0.0.1:3000/login").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              docker compose exec -T api node -e 'fetch("http://127.0.0.1:4000/v1/public/learning").then(async r=>{if(!r.ok||!Array.isArray((await r.json()).courses))process.exit(1)}).catch(()=>process.exit(1))'
              exit 0
            fi
            sleep 1
          done
          docker compose logs --tail=30 api web
          exit 1
