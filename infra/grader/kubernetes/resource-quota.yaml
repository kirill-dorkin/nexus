apiVersion: v1
kind: ResourceQuota
metadata:
  name: grader-sandbox-capacity
  namespace: platform-grader-sandbox
spec:
  hard:
    count/jobs.batch: "64"
    count/pods: "64"
    count/secrets: "4096"
    requests.cpu: "64"
    limits.cpu: "64"
    requests.memory: 32Gi
    limits.memory: 32Gi
    requests.ephemeral-storage: 32Gi
    limits.ephemeral-storage: 32Gi
