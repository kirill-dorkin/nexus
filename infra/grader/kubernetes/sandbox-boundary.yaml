apiVersion: v1
kind: Namespace
metadata:
  name: grader-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grader-gateway
  namespace: grader-control
---
apiVersion: v1
kind: Namespace
metadata:
  name: grader-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grader-sandbox
  namespace: grader-sandbox
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: grader-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grader-gateway-sandbox-controller
  namespace: grader-sandbox
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grader-gateway-sandbox-controller
  namespace: grader-sandbox
subjects:
  - kind: ServiceAccount
    name: grader-gateway
    namespace: grader-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grader-gateway-sandbox-controller
