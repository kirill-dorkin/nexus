apiVersion: v1
kind: LimitRange
metadata:
  name: grader-sandbox-hard-envelope
  namespace: platform-grader-sandbox
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 512Mi
      min:
        cpu: 1m
        memory: 16Mi
        ephemeral-storage: 16Mi
