apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grader-gateway-sandbox-controller
  namespace: platform-grader-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grader-gateway-sandbox-controller
  namespace: platform-grader-sandbox
subjects:
  - kind: ServiceAccount
    name: grader-gateway
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grader-gateway-sandbox-controller
