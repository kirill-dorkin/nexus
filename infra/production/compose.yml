# PostgreSQL 18 preserves the existing migration/app/worker role separation.
# No development password, public database port, or grader process is deployed.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets:
      [
        database_admin_password,
        database_app_password,
        database_migration_password,
        database_worker_password
      ]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/001-runtime-roles.sh:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          "PGPASSWORD=$$(cat /run/secrets/database_app_password) psql -h 127.0.0.1 -U platform_app -d platform -c 'SELECT 1' >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    image: ${PLATFORM_IMAGE:?Set the tested image digest}
    command: [web]
    environment:
      WEB_APP_ORIGIN: https://${PUBLIC_HOST:?Set the HTTPS hostname}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    image: ${PLATFORM_IMAGE:?Set the tested image digest}
    command: [api]
    environment:
      WEB_APP_ORIGIN: https://${PUBLIC_HOST:?Set the HTTPS hostname}
      DATABASE_URL_FILE: /run/secrets/database_app_url
      PAYMENT_PROVIDER: unavailable
    secrets: [database_app_url]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  migrate:
    image: ${PLATFORM_IMAGE:?Set the tested image digest}
    command: [migrate]
    profiles: [migration]
    environment:
      DATABASE_MIGRATION_URL_FILE: /run/secrets/database_migration_url
    secrets: [database_migration_url]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  proxy:
    image: caddy:2
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the HTTPS hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
  payment-worker:
    image: ${PLATFORM_IMAGE:?Set the tested image digest}
    command: [payments]
    profiles: [commerce]
    environment:
      DATABASE_WORKER_URL_FILE: /run/secrets/database_worker_url
    secrets: [database_worker_url]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
secrets:
  database_admin_password:
    file: ./secrets/database-admin-password
  database_app_password:
    file: ./secrets/database-app-password
  database_migration_password:
    file: ./secrets/database-migration-password
  database_worker_password:
    file: ./secrets/database-worker-password
  database_app_url:
    file: ./secrets/database-app-url
  database_migration_url:
    file: ./secrets/database-migration-url
  database_worker_url:
    file: ./secrets/database-worker-url
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
